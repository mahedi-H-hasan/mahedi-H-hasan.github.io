name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      branch_confirmation:
        description: "Type the exact branch name you selected above to confirm deploying it to the live site."
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment branch
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_BRANCH: ${{ inputs.branch_confirmation }}
        run: |
          if [ "$CONFIRM_BRANCH" != "$GITHUB_REF_NAME" ]; then
            echo "Confirmation must match the selected branch ($GITHUB_REF_NAME)." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
